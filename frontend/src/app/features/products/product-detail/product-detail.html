<section *ngIf="product$ | async as product">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ product.nome }}</mat-card-title>
      <mat-card-subtitle>{{ product.prezzo | currency:'EUR' }}</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <p>{{ product.descrizione }}</p>
      <p *ngIf="product.valutazione_media !== null">
        Valutazione media: {{ product.valutazione_media }}/5
      </p>
      <p>Disponibilità: {{ product.giacenza }} pz</p>
    </mat-card-content>

    <mat-card-actions>
      <button mat-raised-button color="primary" routerLink="/products">
        Torna al catalogo
      </button>
    </mat-card-actions>
  </mat-card>
</section>
