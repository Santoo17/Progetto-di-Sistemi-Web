    <mat-card appearance="outlined">
      @if (product.thumbnail && !imageFailed()) {
        <img
          mat-card-image
          [src]="product.thumbnail"
          [alt]="product.title"
          (error)="imageFailed.set(true)" />
      } @else {
        <div class="image-placeholder" role="img" [attr.aria-label]="product.title">
          <span>{{ product.title }}</span>
        </div>
      }

      <mat-card-header>
        <mat-card-title>{{ product.title }}</mat-card-title>
        <mat-card-subtitle>{{ product.price | currency:'EUR' }}</mat-card-subtitle>
        @if (product.tags.length) {
          <mat-card-subtitle>Tag: {{ product.tags.join(', ') }}</mat-card-subtitle>
        }
      </mat-card-header>

      <mat-card-content>
        <ng-content></ng-content>
      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button [routerLink]="['/products', product.id]">Dettagli</button>
        <button mat-flat-button color="primary" (click)="add.emit(product)">
          <mat-icon aria-hidden="true">add_shopping_cart</mat-icon>
          Aggiungi
        </button>
      </mat-card-actions>
    </mat-card>
