@if (product$ | async; as product){
<section >
  <mat-card>
    <div class="detail">
      @if (product.thumbnail) {
        <img class="detail-image" [src]="product.thumbnail" [alt]="product.title" />
      }

      <div class="detail-info">
        <mat-card-header>
          <mat-card-title>{{ product.title }}</mat-card-title>
          <mat-card-subtitle>{{ product.price | currency:'EUR' }}</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
          <p>{{ product.description }}</p>
        </mat-card-content>
      </div>
    </div>

    <mat-card-actions>
      <button  class="back-button" mat-raised-button color="primary" routerLink="/products">
        Torna al catalogo
      </button>
      @if (!isAdmin()) {
        <button mat-flat-button color="primary" (click)="onAdd(product)">
          <mat-icon aria-hidden="true">add_shopping_cart</mat-icon>
          Aggiungi
        </button>
      }
      @if (isAdmin()) {
        <button  class="edit-button" mat-raised-button color="accent" routerLink="/products/edit/{{ product.id }}">
          Modifica prodotto
        </button>
      }
      @if (isAdmin()) {
        <button  class="delete-button" mat-raised-button color="warn" type="button"
                [disabled]="deleting()" (click)="onDelete(product)">
          {{ deleting() ? 'Eliminazione...' : 'Elimina' }}
        </button>
      }

      @if (error()) {
        <p class="form-error" role="alert" style="margin-left: 4px;">{{ error() }}</p>
      }
    </mat-card-actions>
  </mat-card>
</section>
} @else {
  <p>Prodotto non trovato.</p>
}
