<section class="register-page">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Registrati</mat-card-title>
    </mat-card-header>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-card-content>
        <mat-form-field appearance="outline">
          <mat-label>Nome</mat-label>
          <input matInput formControlName="nome" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Cognome</mat-label>
          <input matInput formControlName="cognome" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Password</mat-label>
          <input matInput formControlName="password" type="password" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Indirizzo (opzionale)</mat-label>
          <input matInput formControlName="indirizzo" />
        </mat-form-field>

        <p *ngIf="error" class="register-error" role="alert">{{ error }}</p>
      </mat-card-content>

      <mat-card-actions>
        <button mat-raised-button color="primary" type="submit" [disabled]="loading">
          {{ loading ? 'Registrazione in corso...' : 'Registrati' }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</section>
