<div class="cart-page">
  <h1>Il tuo carrello</h1>

  <ng-container *ngIf="items$ | async as items">
    <p *ngIf="items.length === 0">
      Il carrello è vuoto. <a routerLink="/products">Vai al catalogo</a>.
    </p>

    <mat-card *ngFor="let item of items" class="cart-item">
      <div class="cart-item-info">
        <strong>{{ item.product.nome }}</strong>
        <span>{{ item.product.prezzo | currency:'EUR' }}</span>
      </div>

      <div class="cart-item-qty">
        <button mat-icon-button (click)="decrease(item)">
          <mat-icon>remove</mat-icon>
        </button>
        <span>{{ item.quantity }}</span>
        <button mat-icon-button (click)="increase(item)">
          <mat-icon>add</mat-icon>
        </button>
      </div>

      <button mat-icon-button color="warn" (click)="remove(item)">
        <mat-icon>delete</mat-icon>
      </button>
    </mat-card>

    <div class="cart-total" *ngIf="items.length > 0">
      <strong>Totale: {{ total$ | async | currency:'EUR' }}</strong>
      <button mat-raised-button color="primary" routerLink="/checkout">
        Vai al checkout
      </button>
    </div>
  </ng-container>
</div>
