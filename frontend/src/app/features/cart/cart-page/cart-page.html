<div class="cart-page">
  <h1>Il tuo carrello</h1>
  @if (items$ | async; as items) {
    @if (items.length === 0) {
      <p>Il carrello è vuoto.</p>
      <button class="back-button" mat-raised-button color="primary" routerLink="/products">
        Torna al catalogo
      </button>
    }
   @else {
      @for (item of items$ | async; track item.id) {
        <mat-card class="cart-item">
          <div class="cart-item-info">
            <strong>{{ item.product.title }}</strong>
            <span>{{ item.product.price | currency:'EUR' }}</span>
          </div>

          <div class="cart-item-qty">
            <button mat-icon-button (click)="decrease(item)">
              <mat-icon>remove</mat-icon>
            </button>
            <span>{{ item.quantity }}</span>
            <button mat-icon-button (click)="increase(item)">
              <mat-icon>add</mat-icon>
            </button>
          </div>

          <button mat-icon-button color="warn" (click)="remove(item)">
            <mat-icon>delete</mat-icon>
          </button>
        </mat-card>
      }
          <div class="cart-total">
        <strong>Totale: {{ total$ | async | currency:'EUR' }}</strong>
        <button mat-raised-button color="primary" routerLink="/checkout">
          Vai al checkout
        </button>
        <button class="back-button" mat-raised-button color="primary" routerLink="/products">
          Torna al catalogo
        </button>
      </div>
    
    }
  }
